
name: Build Aflatoon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -o AflatoonOfflineAI_Source.zip -d extracted
          test -f extracted/AflatoonOfflineAI/settings.gradle.kts
          test -f extracted/AflatoonOfflineAI/app/build.gradle.kts

      - name: Fix Java and Kotlin JVM targets
        working-directory: extracted/AflatoonOfflineAI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          marker = "    compileSdk = 35"
          if marker in s and "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  marker,
                  marker + """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""
              )
          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          s = s.replace('jvmTarget = "8"', 'jvmTarget = "17"')
          p.write_text(s)
          print("Java and Kotlin targets updated.")
          PY

      - name: Build debug APK
        working-directory: extracted/AflatoonOfflineAI
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aflatoon-debug-apk
          path: extracted/AflatoonOfflineAI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
