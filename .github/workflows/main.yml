name: Build Aflatoon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project ZIP
        run: |
          unzip -o AflatoonOfflineAI_Source.zip -d extracted
          test -f extracted/AflatoonOfflineAI/settings.gradle.kts
          test -f extracted/AflatoonOfflineAI/app/build.gradle.kts
          test -f extracted/AflatoonOfflineAI/app/src/main/java/com/aflatoon/offlineai/MainActivity.kt

      - name: Fix Android activity and JVM targets
        working-directory: extracted/AflatoonOfflineAI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("app/src/main/java/com/aflatoon/offlineai/MainActivity.kt")
          code = source.read_text(encoding="utf-8")

          code = code.replace(
              "import android.app.Activity",
              "import androidx.activity.ComponentActivity"
          )

          code = code.replace(
              "class MainActivity : Activity(),",
              "class MainActivity : ComponentActivity(),"
          )

          code = re.sub(
              r"override fun onRequestPermissionsResult\(requestCode: Int, permissions: Array<out String>, grantResults: IntArray\)",
              "override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<String>, grantResults: IntArray)",
              code
          )

          if "import androidx.activity.ComponentActivity" not in code:
              raise SystemExit("ERROR: ComponentActivity import was not applied.")

          if "class MainActivity : ComponentActivity()," not in code:
              raise SystemExit("ERROR: MainActivity declaration was not fixed.")

          if "permissions: Array<out String>" in code:
              raise SystemExit("ERROR: Permission callback parameter type was not fixed.")

          source.write_text(code, encoding="utf-8")
          print("MainActivity and permission callback fixed.")

          gradle_file = Path("app/build.gradle.kts")
          gradle = gradle_file.read_text(encoding="utf-8")

          gradle = gradle.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          gradle = gradle.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          gradle = gradle.replace(
              'jvmTarget = "8"',
              'jvmTarget = "17"'
          )

          android_marker = "android {"

          if android_marker not in gradle:
              raise SystemExit("ERROR: Android configuration not found.")

          if "sourceCompatibility = JavaVersion.VERSION_17" not in gradle:
              gradle = gradle.replace(
                  android_marker,
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )

          gradle_file.write_text(gradle, encoding="utf-8")
          print("Java JVM target fixed.")
          PY

      - name: Build debug APK
        working-directory: extracted/AflatoonOfflineAI
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aflatoon-debug-apk
          path: extracted/AflatoonOfflineAI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
